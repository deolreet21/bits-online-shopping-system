<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>My Profile — e-Kiosk</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg"/>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"/>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css"/>
    <link rel="stylesheet" href="/css/main.css"/>
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark">
    <div class="container">
        <a class="navbar-brand" href="/customer/dashboard"><i class="bi bi-shop me-1"></i> e-Kiosk</a>
        <div class="navbar-nav ms-auto gap-1">
            <a class="nav-link" href="/customer/dashboard"><i class="bi bi-speedometer2 me-1"></i>Dashboard</a>
            <a class="nav-link active" th:text="${user.username}">User</a>
            <a class="nav-link" href="/logout"><i class="bi bi-box-arrow-right me-1"></i>Logout</a>
        </div>
    </div>
</nav>

<div class="container py-4">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">

            <div class="d-flex align-items-center mb-4">
                <a href="/customer/dashboard" class="btn btn-outline-secondary btn-sm me-3">
                    <i class="bi bi-arrow-left me-1"></i>Back
                </a>
                <h4 class="mb-0 fw-bold">My Profile</h4>
            </div>

            <!-- Flash messages -->
            <div th:if="${success}" class="alert alert-success alert-dismissible fade show">
                <i class="bi bi-check-circle-fill me-2"></i><span th:text="${success}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>
            <div th:if="${error}" class="alert alert-danger alert-dismissible fade show">
                <i class="bi bi-exclamation-triangle-fill me-2"></i><span th:text="${error}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>

            <div class="card">
                <div class="card-header"><i class="bi bi-person-circle me-2"></i>Account Details</div>
                <div class="card-body p-4">
                    <form th:action="@{/customer/profile/update}" method="post">

                        <div class="mb-3">
                            <label class="form-label">Username</label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="bi bi-person"></i></span>
                                <input type="text" name="username" class="form-control"
                                       th:value="${user.username}" required minlength="3" maxlength="50"/>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Email</label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="bi bi-envelope"></i></span>
                                <input type="email" name="email" class="form-control"
                                       th:value="${user.email}" required maxlength="100"/>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">New Password
                                <span class="text-muted fw-normal small">(leave blank to keep current)</span>
                            </label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="bi bi-lock"></i></span>
                                <input type="password" name="newPassword" class="form-control"
                                       placeholder="Enter new password" minlength="6"/>
                            </div>
                        </div>

                        <hr class="my-3"/>

                        <div class="mb-4 d-flex align-items-center gap-2 text-muted small">
                            <i class="bi bi-calendar3"></i>
                            Member since <strong th:text="${#temporals.format(user.createdDate, 'dd MMM yyyy')}">01 Jan 2026</strong>
                        </div>

                        <button type="submit" class="btn btn-primary w-100">
                            <i class="bi bi-check2-circle me-2"></i>Update Profile
                        </button>
                    </form>
                </div>
            </div>

        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
