<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>Feedback — e-Kiosk Admin</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg"/>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"/>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css"/>
    <link rel="stylesheet" href="/css/main.css"/>
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark px-4">
    <a class="navbar-brand" href="/admin/dashboard"><i class="bi bi-shop-window me-1"></i> e-Kiosk Admin</a>
    <div class="d-flex gap-1 align-items-center ms-auto">
        <a href="/admin/dashboard" class="nav-link"><i class="bi bi-speedometer2 me-1"></i>Dashboard</a>
        <a href="/admin/products"  class="nav-link"><i class="bi bi-box-seam me-1"></i>Products</a>
        <a href="/admin/reports"   class="nav-link"><i class="bi bi-bar-chart-line me-1"></i>Reports</a>
        <a href="/admin/feedback"  class="nav-link active"><i class="bi bi-chat-square-dots me-1"></i>Feedback</a>
        <span class="text-white-50 ms-2 small" th:text="${currentUser?.username}"></span>
        <a href="/logout" class="btn btn-sm btn-outline-light ms-2"><i class="bi bi-box-arrow-right me-1"></i>Logout</a>
    </div>
</nav>

<div class="container py-4">

    <nav aria-label="breadcrumb" class="mb-3">
        <ol class="breadcrumb">
            <li class="breadcrumb-item"><a href="/admin/dashboard">Dashboard</a></li>
            <li class="breadcrumb-item active">Feedback</li>
        </ol>
    </nav>

    <div class="mb-4 d-flex align-items-center gap-3">
        <div>
            <h3 class="fw-bold mb-1 section-title">Customer <span>Feedback</span></h3>
            <p class="text-muted small mb-0"><span class="fw-bold" th:text="${feedbackList.size()}">0</span> feedback entries received</p>
        </div>
    </div>

    <div class="card">
        <div class="card-header fw-semibold"><i class="bi bi-chat-left-text me-2"></i>All Feedback</div>

        <div th:if="${feedbackList.isEmpty()}" class="p-4 text-center text-muted">
            No feedback has been submitted yet.
        </div>

        <div class="table-responsive" th:if="${!feedbackList.isEmpty()}">
            <table class="table table-hover mb-0 align-middle">
                <thead class="table-light">
                    <tr>
                        <th>Date</th>
                        <th>Customer</th>
                        <th>Product</th>
                        <th class="text-center">Rating</th>
                        <th>Comment</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="fb : ${feedbackList}">
                        <!-- #temporals.format is Thymeleaf's built-in date formatter for Java 8 time types -->
                        <td class="text-nowrap text-muted small"
                            th:text="${#temporals.format(fb.feedbackDate, 'dd MMM yyyy')}"></td>
                        <td th:text="${fb.user.username}"></td>
                        <td>
                            <span th:if="${fb.product != null}" th:text="${fb.product.name}"></span>
                            <span th:if="${fb.product == null}" class="text-muted fst-italic">General</span>
                        </td>
                        <td class="text-center">
                            <!--
                                th:classappend conditionally appends a CSS class without replacing
                                the existing classes — used here to colour ratings via Bootstrap
                                text utilities: green (≥4), yellow (3), red (<3)
                            -->
                            <span class="fw-bold fs-5"
                                  th:text="${fb.rating} + '★'"
                                  th:classappend="${fb.rating >= 4} ? 'text-success'
                                               : (${fb.rating == 3} ? 'text-warning'
                                               : 'text-danger')">
                            </span>
                        </td>
                        <td th:text="${fb.comment}" class="text-wrap"></td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

</div>
</body>
</html>
