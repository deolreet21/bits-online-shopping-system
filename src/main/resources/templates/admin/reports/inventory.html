<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>Inventory Report — e-Kiosk Admin</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg"/>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"/>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css"/>
    <link rel="stylesheet" href="/css/main.css"/>
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark px-4">
    <a class="navbar-brand" href="/admin/dashboard"><i class="bi bi-shop-window me-1"></i> e-Kiosk Admin</a>
    <div class="d-flex gap-1 align-items-center ms-auto">
        <a href="/admin/dashboard" class="nav-link"><i class="bi bi-speedometer2 me-1"></i>Dashboard</a>
        <a href="/admin/products"  class="nav-link"><i class="bi bi-box-seam me-1"></i>Products</a>
        <a href="/admin/reports"   class="nav-link active"><i class="bi bi-bar-chart-line me-1"></i>Reports</a>
        <a href="/admin/feedback"  class="nav-link"><i class="bi bi-chat-square-dots me-1"></i>Feedback</a>
        <span class="text-white-50 ms-2 small" th:text="${loggedInUser?.username}"></span>
        <a href="/logout" class="btn btn-sm btn-outline-light ms-2"><i class="bi bi-box-arrow-right me-1"></i>Logout</a>
    </div>
</nav>

<div class="container py-4">

    <nav aria-label="breadcrumb" class="mb-3">
        <ol class="breadcrumb">
            <li class="breadcrumb-item"><a href="/admin/dashboard">Dashboard</a></li>
            <li class="breadcrumb-item"><a href="/admin/reports">Reports</a></li>
            <li class="breadcrumb-item active">Inventory</li>
        </ol>
    </nav>

    <div class="mb-4 d-flex align-items-center gap-3">
        <div>
            <h3 class="fw-bold mb-1 section-title">Inventory <span>Report</span></h3>
            <p class="text-muted small mb-0">Stock levels across all product categories</p>
        </div>
        <span class="badge bg-primary ms-auto fs-6 px-3 py-2">
            <i class="bi bi-box-seam me-1"></i><span th:text="${products.size()}">0</span> Products
        </span>
    </div>

    <div class="card">
        <div class="card-header fw-semibold"><i class="bi bi-table me-2"></i>All Products</div>
        <div class="table-responsive">
            <table class="table table-hover mb-0">
                <thead class="table-light">
                    <tr>
                        <th>#</th>
                        <th>Product Name</th>
                        <th>Category</th>
                        <th class="text-end">Price (₹)</th>
                        <th class="text-center">Qty on Hand</th>
                        <th class="text-center">Status</th>
                        <th></th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="p : ${products}">
                        <td th:text="${p.id}"></td>
                        <td th:text="${p.name}" class="fw-semibold"></td>
                        <td th:text="${p.category.displayName}"></td>
                        <td class="text-end" th:text="${#numbers.formatDecimal(p.price, 1, 2)}"></td>
                        <td class="text-center fw-bold" th:text="${p.quantityOnHand}"></td>
                        <td class="text-center">
                            <!--
                                Chained th:if blocks work like if/else-if here because the conditions are
                                mutually exclusive — only the first matching block renders for each row.
                            -->
                            <span th:if="${p.quantityOnHand == 0}"
                                  class="badge bg-danger"><i class="bi bi-x-circle me-1"></i>Out of Stock</span>
                            <span th:if="${p.quantityOnHand > 0 and p.quantityOnHand < 5}"
                                  class="badge bg-warning"><i class="bi bi-exclamation-triangle me-1"></i>Low Stock</span>
                            <span th:if="${p.quantityOnHand >= 5}"
                                  class="badge bg-success"><i class="bi bi-check-circle me-1"></i>In Stock</span>
                        </td>
                        <td>
                            <a th:href="@{/admin/products/edit/{id}(id=${p.id})}"
                               class="btn btn-sm btn-outline-primary">Edit</a>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

</div>
</body>
</html>
